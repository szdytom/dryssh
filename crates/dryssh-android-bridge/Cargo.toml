[package]
name = "dryssh-android-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "dryssh"
crate-type = ["cdylib", "rlib"]

[dependencies]
dryssh-core = { path = "../dryssh-core" }
jni.workspace = true
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "sync"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
